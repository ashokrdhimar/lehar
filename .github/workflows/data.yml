name: Lehar Live Data

# Times in UTC. IST = UTC + 5:30
on:
  schedule:
    - cron: '*/15 2-10 * * 1-5'   # every 15 min, ~7:30 AM – 4:00 PM IST, Mon–Fri
  workflow_dispatch:               # manual "Run workflow" for testing

permissions:
  contents: write                  # needed to commit data.json back to repo

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install yfinance pandas numpy ta

      - name: Generate data.json
        run: python generate_data.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Update data.json [skip ci]"
          git push
